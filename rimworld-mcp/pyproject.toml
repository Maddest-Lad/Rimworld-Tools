[project]
name = "rimworld-tools"
version = "0.1.0"
description = "Tools for interacting with, debugging and modding Rimworld"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "vdf>=3.4",
    "requests>=2.32",
    "toposort>=1.10",
    "networkx>=3.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "psutil>=6.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "black>=24.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
