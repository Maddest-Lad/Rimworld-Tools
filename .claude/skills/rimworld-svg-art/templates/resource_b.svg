<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
  <!-- Template: resource item, medium stack (_b). Same pieces as _a, three of them, overlapping.
       Back pieces first; each piece carries its own outline so overlaps stay readable, a touch
       thinner (2.5 px) than a lone piece so the heap does not turn into a web of black lines. -->
  <defs>
    <path id="gem" d="M-6 6 L-3 -5 L3 -8 L8 -2 L6 8 L-1 10 Z"/>
    <clipPath id="c-gem"><use xlink:href="#gem"/></clipPath>
    <g id="piece">
      <use xlink:href="#gem" fill="#000000" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <use xlink:href="#gem" fill="#3f9e8f"/>
      <g clip-path="url(#c-gem)">
        <path d="M-3 -5 L3 -8 L8 -2 L1 0 Z" fill="#6ab4a6"/>
        <path d="M1 0 L8 -2 L6 8 L-1 10 Z" fill="#347f72"/>
      </g>
    </g>
  </defs>
  <use xlink:href="#piece" transform="translate(24 28) rotate(-20)"/>
  <use xlink:href="#piece" transform="translate(40 30) rotate(15)"/>
  <use xlink:href="#piece" transform="translate(32 40)"/>
</svg>
